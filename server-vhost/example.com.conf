<VirtualHost *:80>
	ServerName example.com
	ServerAlias www.example.com
	DocumentRoot /var/www/example.com/wordpress

	<Directory /var/www/example.com/wordpress>
    	Options FollowSymLinks
    	AllowOverride Limit Options FileInfo
    	DirectoryIndex index.php
    	Require all granted
    </Directory>
    <Directory /var/www/example.com/wordpress/wp-content>
        Options FollowSymLinks
        Require all granted
    </Directory>

	ServerAdmin webmaster@example.com
	ErrorLog /var/log/apache2/server_name_error.log
	CustomLog /var/log/apache2/server_name_access.log combined
</VirtualHost>
