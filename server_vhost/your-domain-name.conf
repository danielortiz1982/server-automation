<VirtualHost *:80>
	ServerName $SERVER_DOMAIN_NAME
	ServerAlias www.$SERVER_DOMAIN_NAME
	DocumentRoot /var/www/$SERVER_DOMAIN_NAME

	<Directory /var/www/$SERVER_DOMAIN_NAME>
    	Options FollowSymLinks
    	AllowOverride Limit Options FileInfo
    	DirectoryIndex index.php
    	Require all granted
    </Directory>
    <Directory /var/www/$SERVER_DOMAIN_NAME/wp-content>
        Options FollowSymLinks
        Require all granted
    </Directory>

	ServerAdmin webmaster@$SERVER_DOMAIN_NAME
	ErrorLog /var/log/apache2/$SERVER_NAME_error.log
	CustomLog /var/log/apache2/$SERVER_NAME_access.log combined
</VirtualHost>
